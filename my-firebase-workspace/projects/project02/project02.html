<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="./css/pro02.css">
</head>

<body>
    <main id="main">
        <article id="card">
            <div class="rec1"></div>
            <div class="rec2">
                <img src="img/ugalz.png" alt="Card header background">
            </div>
            <img src="img/man.png" alt="Johnny Rogers profile picture" class="man">
            <h1 class="name">Johnny Rogers</h1>
            <p class="it">@jonnyrogers</p>

            <ul class="social">
                <li><a href="#"><img src="img/facebook.png" alt="Facebook"></a></li>
                <li><a href="#"><img src="img/in.png" alt="LinkedIn"></a></li>
                <li><a href="#"><img src="img/x.png" alt="X (Twitter)"></a></li>
                <li><a href="#"><img src="img/insta.png" alt="Instagram"></a></li>
                <li><a href="#"><img src="img/Group.svg" alt="Dribbble"></a></li>
            </ul>
            <p class="info">Crafting brand and communication strategies, creating visual designs, leading art direction,
                and capturing portraits through photography.</p>
            <div class="button-group">
                <button type="button" class="button follow">Follow</button>
                <button type="button" class="button message">Message</button>
            </div>
        </article>
    </main>

</body>

</html>
