    <title>Document</title>
    <link rel="stylesheet" href=".css/ex09.css">
</head>

<body>

        <header>
            <h2>This is header and navigations</h2>

                <ul>
                    <li><a href="#">link 1</a></li>
                    <li><a href="#">link 2</a></li>

            <p>Footer contents here!</p>
        </footer>
